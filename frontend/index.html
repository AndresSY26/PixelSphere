<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PixelSphere | Gestión Multimedia con IA Profesional</title>
    <meta name="description" content="Plataforma multimedia inteligente con IA generativa, bóveda cifrada y streaming neural." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a1a1f" />
  </head>
  <body class="font-body antialiased bg-background text-foreground min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(
            function(reg) { console.log('Service Worker registrado:', reg.scope); },
            function(err) { console.error('Fallo en registro de SW:', err); }
          );
        });
      }
    </script>
  </body>
</html>
